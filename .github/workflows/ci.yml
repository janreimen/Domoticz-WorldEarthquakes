name: CI

# 🚀 Define when the workflow should run
on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    # 🔒 Explicit minimum permissions to resolve CodeQL warnings
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check Python Syntax
        run: |
          python -m py_compile plugin.py modules/*.py tests/*.py tools/*.py
