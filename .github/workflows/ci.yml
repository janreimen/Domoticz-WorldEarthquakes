name: CI

# Optional: Workflow-level permissions
# permissions:
#   contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    
    # 🔒 Add explicit minimum permissions here to resolve the CodeQL warning
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check Python Syntax
        run: |
          python -m py_compile plugin.py modules/*.py tests/*.py tools/*.py
